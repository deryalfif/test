{% extends 'base.html' %}

{% block title %}Jurnal Harian - Sistem Absensi{% endblock %}

{% block content %}
<div x-data="journalPage()">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Jurnal Harian</h1>
        <button @click="showForm = true; editMode = false; resetForm()"
                class="mt-4 md:mt-0 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
            <i class="fas fa-plus mr-2"></i>Buat Jurnal Baru
        </button>
    </div>

    <!-- Filter -->
    <div class="bg-white rounded-xl shadow-md p-4 mb-6">
        <div class="flex flex-col md:flex-row gap-4">
            <select x-model="filterClass" @change="loadJournals()"
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                <option value="">Semua Kelas</option>
                <template x-for="cls in classes" :key="cls.id">
                    <option :value="cls.id" x-text="cls.name"></option>
                </template>
            </select>
            <input type="month" x-model="filterMonth" @change="loadJournals()"
                   class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
        </div>
    </div>

    <!-- Journal List -->
    <div class="space-y-4">
        <template x-for="journal in journals" :key="journal.id">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h3 class="text-lg font-semibold text-gray-800" x-text="journal.subject"></h3>
                        <p class="text-sm text-gray-500" x-text="formatDate(journal.date)"></p>
                    </div>
                    <div class="flex space-x-2">
                        <button @click="editJournal(journal)" class="p-2 text-blue-600 hover:bg-blue-50 rounded">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button @click="deleteJournal(journal.id)" class="p-2 text-red-600 hover:bg-red-50 rounded">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="space-y-2 text-sm">
                    <p><span class="font-medium">Materi:</span> <span x-text="journal.materials_covered"></span></p>
                    <p x-show="journal.activities"><span class="font-medium">Kegiatan:</span> <span x-text="journal.activities"></span></p>
                    <p x-show="journal.homework"><span class="font-medium">PR:</span> <span x-text="journal.homework"></span></p>
                </div>
            </div>
        </template>

        <p x-show="!journals.length" class="text-center text-gray-500 py-8">
            Belum ada jurnal. Klik "Buat Jurnal Baru" untuk memulai.
        </p>
    </div>

    <!-- Form Modal -->
    <div x-show="showForm" class="fixed inset-0 z-50 overflow-y-auto" x-cloak>
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="fixed inset-0 bg-black bg-opacity-50" @click="showForm = false"></div>
            <div class="relative bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4" x-text="editMode ? 'Edit Jurnal' : 'Buat Jurnal Baru'"></h2>

                <form @submit.prevent="saveJournal()">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Kelas</label>
                            <select x-model="form.class_id" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                                <option value="">Pilih Kelas</option>
                                <template x-for="cls in classes" :key="cls.id">
                                    <option :value="cls.id" x-text="cls.name"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tanggal</label>
                            <input type="date" x-model="form.date" required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Mata Pelajaran</label>
                        <input type="text" x-model="form.subject" required placeholder="Contoh: Matematika"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Materi yang Diajarkan</label>
                        <textarea x-model="form.materials_covered" required rows="3" placeholder="Jelaskan materi..."
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Kegiatan Pembelajaran</label>
                        <textarea x-model="form.activities" rows="2" placeholder="Opsional..."
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Pekerjaan Rumah (PR)</label>
                        <textarea x-model="form.homework" rows="2" placeholder="Opsional..."
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>

                    <div class="flex justify-end space-x-3">
                        <button type="button" @click="showForm = false"
                                class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">Batal</button>
                        <button type="submit" :disabled="saving"
                                class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50">
                            <span x-text="saving ? 'Menyimpan...' : 'Simpan'"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function journalPage() {
    return {
        showForm: false,
        editMode: false,
        saving: false,
        journals: [],
        classes: [
            { id: 1, name: 'Kelas 1A' },
            { id: 2, name: 'Kelas 1B' },
            { id: 3, name: 'Kelas 2A' }
        ],
        filterClass: '',
        filterMonth: '',
        form: {
            id: null,
            class_id: '',
            date: new Date().toISOString().split('T')[0],
            subject: '',
            materials_covered: '',
            activities: '',
            homework: ''
        },

        async init() {
            await this.loadJournals();
        },

        async loadJournals() {
            let url = '/api/journal/class/' + (this.filterClass || '1');
            if (this.filterMonth) {
                const [year, month] = this.filterMonth.split('-');
                url += `?year=${year}&month=${month}`;
            }
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.success) {
                    this.journals = data.journals;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        },

        resetForm() {
            this.form = {
                id: null,
                class_id: '',
                date: new Date().toISOString().split('T')[0],
                subject: '',
                materials_covered: '',
                activities: '',
                homework: ''
            };
        },

        editJournal(journal) {
            this.form = { ...journal };
            this.editMode = true;
            this.showForm = true;
        },

        async saveJournal() {
            this.saving = true;
            try {
                const url = this.editMode ? `/api/journal/${this.form.id}` : '/api/journal';
                const method = this.editMode ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });

                const data = await response.json();
                if (data.success) {
                    this.showForm = false;
                    await this.loadJournals();
                    alert('Jurnal berhasil disimpan!');
                }
            } catch (error) {
                alert('Gagal menyimpan jurnal');
            } finally {
                this.saving = false;
            }
        },

        async deleteJournal(id) {
            if (!confirm('Yakin ingin menghapus jurnal ini?')) return;

            try {
                const response = await fetch(`/api/journal/${id}`, { method: 'DELETE' });
                const data = await response.json();
                if (data.success) {
                    await this.loadJournals();
                }
            } catch (error) {
                alert('Gagal menghapus jurnal');
            }
        },

        formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('id-ID', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
        }
    }
}
</script>
{% endblock %}
